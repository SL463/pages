<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pages.livengood.ai</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
    background:radial-gradient(1000px 400px at 50% -150px,#14203a 0%,transparent 70%),#0b1220;
    color:#eaf0fb;min-height:100vh;display:grid;place-items:center;padding:24px;
  }
  .hub{max-width:520px;width:100%;text-align:center}
  .kicker{display:inline-block;letter-spacing:.28em;text-transform:uppercase;font-size:11px;
    font-weight:700;color:#3ddc84;border:1px solid #1f9d5b;border-radius:100px;padding:6px 14px;margin-bottom:20px}
  h1{font-size:34px;font-weight:800;letter-spacing:-.02em;margin-bottom:10px}
  p{color:#93a3c0;margin-bottom:28px}
  .links{display:grid;gap:12px}
  a.tile{
    display:flex;align-items:center;justify-content:space-between;
    background:linear-gradient(180deg,#121b2e,#18243c);border:1px solid #26344f;
    border-radius:14px;padding:18px 20px;text-decoration:none;color:#eaf0fb;
    font-weight:700;transition:border-color .15s,transform .15s;
  }
  a.tile:hover{border-color:#3ddc84;transform:translateY(-2px)}
  a.tile .arrow{color:#3ddc84;font-size:20px}
  a.tile small{display:block;color:#93a3c0;font-weight:400;font-size:13px;margin-top:3px}
  footer{margin-top:28px;color:#5b6a86;font-size:12px}
</style>
</head>
<body>
  <div class="hub">
    <span class="kicker">pages.livengood.ai</span>
    <h1>Livengood Pages</h1>
    <p>A little home for one-off pages and recaps.</p>
    <div class="links">
      <a class="tile" href="/draft-recap">
        <span>🏈 2026 Fantasy Draft Recap<small>Top 5 most interesting moves — Livengood League</small></span>
        <span class="arrow">→</span>
      </a>
    </div>
    <footer>Built with Claude</footer>
  </div>
</body>
</html>
